name: iOS

# Baut die iOS-App auf einem macOS-Runner (lokal steht kein Mac zur Verfügung).
# Dieser Job kompiliert nur (Simulator, ohne Signierung) und dient als Verifikation.
# Der TestFlight-Upload wird separat ergänzt (benötigt App-Store-Connect-Secrets).

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        run: xcodegen generate

      - name: Bauen (Simulator, ohne Signierung)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Roster.xcodeproj \
            -scheme Roster \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
