name: iOS TestFlight

# Signiert (fastlane match), baut und lädt die App zu TestFlight. match legt das
# Verteil-Zertifikat + Profil verschlüsselt im Branch `match-certs` dieses Repos ab
# und verwendet es bei jedem Lauf wieder (kein Zertifikats-Churn auf CI-Runnern).
#
# Voraussetzungen (einmalig):
#   Variables: IOS_BUNDLE_ID (de.thomas-peterson.roster), IOS_TEAM_ID
#   Secrets:   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8, MATCH_PASSWORD
#   Sowie ein App-Record in App Store Connect für die Bundle-ID (für den Upload).

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

jobs:
  testflight:
    runs-on: macos-14
    permissions:
      contents: write # match speichert Zertifikate im Branch match-certs
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        run: xcodegen generate

      - name: API-Key ablegen
        run: |
          echo "${{ secrets.ASC_API_KEY_P8 }}" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: fastlane beta (match + build + TestFlight)
        run: fastlane beta
